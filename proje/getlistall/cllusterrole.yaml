apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: listall
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["*"] # "services", "endpoints", "pods", "pods/log" etc.
  verbs: ["list","get"] # "get", "list", "watch", "post", "put", "create", "update", "patch", "delete"
