apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo-sa
  namespace: mongodb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongo-pod-reader
  namespace: mongodb
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongo-pod-reader-binding
  namespace: mongodb
subjects:
  - kind: ServiceAccount
    name: default
    namespace: mongodb
roleRef:
  kind: Role
  name: mongo-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mongo-cluster-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mongo-cluster-pod-reader-binding
subjects:
  - kind: ServiceAccount
    name: mongo-sa
    namespace: mongodb
roleRef:
  kind: ClusterRole
  name: mongo-cluster-pod-reader
  apiGroup: rbac.authorization.k8s.io
