apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: test
  name: doitall
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["*"] # "services", "endpoints", "pods", "pods/log" etc.
  verbs: ["*"] # "get", "list", "watch", "post", "put", "create", "update", "patch", "delete"
