apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-admin-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-deploy-rs-admin
rules:
- apiGroups: [""]  # pods
  resources: ["pods"]
  verbs: ["*"]
- apiGroups: ["apps"]  # deployments ve replicasets
  resources: ["deployments", "replicasets"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-deploy-rs-admin-binding
subjects:
- kind: ServiceAccount
  name: pod-admin-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: pod-deploy-rs-admin
  apiGroup: rbac.authorization.k8s.io
